[package]
name = "player-wasm"
publish = false
version = "0.1.6"
edition = "2021"
description = "Player-only WebAssembly facade for reading and decoding Bitneedle records."
repository = "https://github.com/bitneedle/bitneedle"
license = "Apache-2.0"

[lib]
name = "player_wasm"
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
anyhow = "1"
base64 = "0.22.1"
console_error_panic_hook = "0.1"
encodec-rs = { version = "0.1.2", features = ["ecdc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
record-core = "0.1.7"
record-decode = "0.1.7"
record-descriptor = "0.1.7"
record-sidecar = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
thiserror = "2"
sha2 = "0.11.0"
wasm-bindgen = "0.2"

[dev-dependencies]
record-cut = "0.1.7"
record-render = "0.1.7"
