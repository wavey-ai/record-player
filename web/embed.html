<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vin.yl.player embed</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var root = document.documentElement;
      var themes = {
        "red": { bg: "#ff0a16", tone: "#fff8f6", turntable: "#ff003c" },
        "hifi-black": { bg: "#050505", tone: "#f5f5ef", turntable: "#161616" },
        "hifi-white": { bg: "#f5f5ef", tone: "#050505", turntable: "#deded8" }
      };

      var theme = params.get("theme");
      if (themes[theme]) {
        root.dataset.theme = theme;
        root.style.setProperty("--embed-bg", themes[theme].bg);
        root.style.setProperty("--embed-tone", themes[theme].tone);
        root.style.setProperty("--embed-turntable", themes[theme].turntable);
      }

      function normalizeHex(value) {
        if (!value) return null;
        if (value === "black") return "#000000";
        if (!/^#?[0-9a-fA-F]{3,8}$/.test(value)) return null;
        return value.charAt(0) === "#" ? value : "#" + value;
      }

      function applyColor(param, variable) {
        var color = normalizeHex(params.get(param));
        if (color) root.style.setProperty(variable, color);
      }

      // Explicit colour parameters override the selected theme. ?bg=transparent
      // skips the hex-colour path entirely (it fails
      // normalizeHex's hex check) and instead flips a class so the host
      // page showing through behind the iframe is possible — see the
      // html.embed-mode.embed-transparent-bg override in styles.css,
      // which needs its own !important to beat the existing
      // html.embed-mode background rule.
      if (params.get("bg") === "transparent") {
        root.classList.add("embed-transparent-bg");
      } else {
        applyColor("bg", "--embed-bg");
      }
      applyColor("tone", "--embed-tone");
      applyColor("turntable", "--embed-turntable");

      root.classList.add("embed-mode");
      if (params.get("controls") === "0") {
        root.classList.add("embed-hide-controls");
      }
      if (params.get("status") === "0") {
        root.classList.add("embed-hide-status");
      }

      var lastHeight = 0;
      function reportHeight() {
        if (window.parent === window) return;
        var height = Math.ceil(document.documentElement.scrollHeight);
        if (height === lastHeight) return;
        lastHeight = height;
        window.parent.postMessage({ type: "bitneedle-embed-height", height: height }, "*");
      }

      document.addEventListener("DOMContentLoaded", reportHeight);
      window.addEventListener("load", reportHeight);
      window.addEventListener("resize", reportHeight);
      if (window.ResizeObserver) {
        document.addEventListener("DOMContentLoaded", function () {
          new ResizeObserver(reportHeight).observe(document.documentElement);
        });
      } else {
        window.setInterval(reportHeight, 500);
      }
    }());
  </script>
</head>
<body class="embed-page">
  <main class="player-shell embed-shell">
    <section class="deck embed-deck" aria-label="Record player embed">
      <canvas id="player-canvas" aria-label="Interactive Bitneedle record player"></canvas>

      <dl id="record-metadata" class="metadata" hidden>
        <div><dt>PROFILE</dt><dd id="meta-profile"></dd></div>
        <div><dt>CONTAINER</dt><dd id="meta-container"></dd></div>
        <div><dt>RELEASE</dt><dd id="meta-release"></dd></div>
      </dl>
      <output id="status" class="embed-status">Choose a Bitneedle PNG record or audio file.</output>

      <div class="transport fallback-controls embed-controls">
        <button id="load" type="button">LOAD RECORD</button>
        <button id="play" type="button">START</button>
        <button id="needle" type="button">NEEDLE UP</button>
      </div>
      <div class="fallback-controls rpm-controls embed-controls" aria-label="Record speed">
        <span>RPM</span>
        <button id="rpm-33" type="button">33⅓</button>
        <button id="rpm-45" type="button">45</button>
      </div>
      <label class="fallback-controls timeline embed-controls"><span>VARIABLE RPM</span><input id="rpm" type="range" min="16" max="90" step="0.01" value="33.333333"></label>
      <label class="fallback-controls timeline embed-controls"><span>VOLUME</span><input id="volume" type="range" min="0" max="1" step="0.001" value="1"></label>
      <label class="fallback-controls timeline embed-controls"><span>XFADE</span><input id="xfade" type="range" min="0" max="1" step="0.001" value="0.5"></label>
      <details class="fallback-controls advanced-controls embed-controls">
        <summary>ADVANCED CONTROLS</summary>
        <div class="technique-control"><label for="scratch-preset">SCRATCH</label><div class="technique-picker"><select id="scratch-preset">
          <option value="baby">BABY</option>
          <option value="stab">STAB</option>
          <option value="chirp">CHIRP</option>
          <option value="transform">TRANSFORM</option>
          <option value="flare">FLARE</option>
          <option value="crab">CRAB</option>
          <option value="orbit">ORBIT</option>
          <option value="drum">DRUM</option>
        </select><button id="scratch-preset-next" type="button" aria-label="Select next scratch preset">NEXT</button></div></div>
        <div id="scratch-clicks-control" class="timeline" hidden><label for="scratch-clicks">CLICKS <output id="scratch-clicks-value">1</output></label><div class="technique-picker"><input id="scratch-clicks" type="range" min="1" max="8" step="1" value="1" disabled><button id="scratch-clicks-next" type="button" aria-label="Select next scratch click count" disabled>+1</button></div></div>
        <label class="timeline" title="Dynamically softens excessive upper-band signal acceleration while retaining the unprocessed lows and mids."><span>HF ACCEL LIMITER <output id="hf-acceleration-limit-value">35%</output></span><input id="hf-acceleration-limit" type="range" min="0" max="1" step="0.01" value="0.35" aria-describedby="hf-acceleration-limit-help"></label>
        <span id="hf-acceleration-limit-help" class="control-help">PROGRAMME TRANSIENTS · NOT STYLUS TRACING</span>
        <label class="timeline" title="Models the high-frequency tracing loss of a physical stylus during demanding playback and scratching."><span>STYLUS TRACING <output id="stylus-tracing-limit-value">72%</output></span><input id="stylus-tracing-limit" type="range" min="0" max="1" step="0.01" value="0.72"></label>
      </details>
      <label class="fallback-controls timeline embed-controls"><span>POSITION</span><input id="seek" type="range" min="0" max="1" step="0.0001" value="0" disabled></label>
      <input id="file" type="file" accept="image/png,.png,audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.opus" hidden>
    </section>
  </main>
  <script type="module" src="./player-host.js"></script>
</body>
</html>
