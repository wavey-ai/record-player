[package]
name = "record-player"
version = "0.1.0"
edition = "2021"
description = "Shared Bitneedle transport, record physics, and acoustic scratch engine"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
approx = "0.5"
assert_no_alloc = "1.1.2"

[workspace]
members = [".", "crates/record-player-capi"]
resolver = "2"
