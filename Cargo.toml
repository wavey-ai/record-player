[workspace]
members = [".", "simulation"]

[package]
name = "bitneedle-record-player-core"
version = "0.1.0"
edition = "2021"
description = "Typed Bitneedle player state engine and browser command protocol"
license = "Apache-2.0"
repository = "https://github.com/bitneedle/bitneedle"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
serde_json = "1"
