[workspace]
members = [".", "player-wasm"]
default-members = ["."]
resolver = "2"

[package]
name = "record-player"
version = "0.1.0"
edition = "2021"
description = "Standalone Bitneedle record player, acoustic scratch engine, and browser command protocol"
license = "Apache-2.0"
repository = "https://github.com/bitneedle/bitneedle"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
approx = "0.5"
serde_json = "1"
